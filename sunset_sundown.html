<script>
	// Get today and tomorrow's date
const date = new Date();
const datestring = date.getFullYear() + "-" + (date.getMonth() + 1) + "-" + date.getDate();
let tomorrow = new Date();
tomorrow.setDate(tomorrow.getDate() + 1);
const tomorrowstring = tomorrow.getFullYear() + "-" + (tomorrow.getMonth() + 1) + "-" + tomorrow.getDate();

// Coordinates for Jamestown, NY (adjust for your own location)
// You can use Google Maps to get your coordinates
const latitude = 52.419048;
const longitude = -1.529008;

// Construct URL and parameters to fetch the sunrise and sunset data from the free api at sunrisesunset.io
const url = `https://api.sunrisesunset.io/json?lat=${latitude}&lng=${longitude}&date_start=${datestring}&date_end=${tomorrowstring}`;

// Parse the JSON data to obtain the data for displaying the results in the widget
fetch(url)
	.then(response => response.json())
	.then(data => {
		document.querySelector('#sunrise').innerHTML = data.results[0].sunrise
		document.querySelector('#sunset').innerHTML = data.results[0].sunset
		document.querySelector('#sunrisetomorrow').innerHTML = data.results[1].sunrise
		document.querySelector('#sunsettomorrow').innerHTML = data.results[1].sunset	
		})
	.catch(error => console.error('Error:', error));

</script>
