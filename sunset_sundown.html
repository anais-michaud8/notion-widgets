<!--- JS: By Anaïs Michaud --->
	
<script>
// Coordinates for Coventry, UK (adjust for your own location)
// You can use Google Maps to get your coordinates
const latitude = 52.419048;
const longitude = -1.529008;
const timezone = "Etc/GMT-0";
const date = "today";
const time_format = "24";

// Construct URL and parameters to fetch the sunrise and sunset data from the free api at sunrisesunset.io
const url = `https://api.sunrisesunset.io/json?lat=${latitude}&lng=${longitude}&date=${date}&time_format=${time_format}&timezone=${timezone}`;

// Parse the JSON data to obtain the data for displaying the results in the widget
fetch(url)
	.then(response => response.json())
	.then(data => {
		document.querySelector('#sunrise').innerHTML = data.results.sunrise
		document.querySelector('#sunset').innerHTML = data.results.sunset
		})
	.catch(error => console.error('Error:', error));
</script>
