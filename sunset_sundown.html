<!--- Script for the Moon: By Anaïs Michaud --->

<script>

	// Coordinates for Coventry, UK (adjust for your own location) -> You can use Google Maps to get your coordinates
	const latitude = 52.419048;
	const longitude = -1.529008;
	const timezone = "Etc/GMT-0";
	const date = "today";
	const time_format = "24";

	// Images of the moon
	const moon_new             = "https://cdn-icons-png.flaticon.com/512/616/616465.png"; // https://www.flaticon.com/free-icon/moon_616465
	const moon_waxing_crescent = "https://cdn-icons-png.flaticon.com/512/616/616467.png"; // https://www.flaticon.com/free-icon/moon_616467
	const moon_first_quarter   = "https://cdn-icons-png.flaticon.com/512/616/616469.png"; // https://www.flaticon.com/free-icon/moon_616469
	const moon_waxing_gibbous  = "https://cdn-icons-png.flaticon.com/512/616/616471.png"; // https://www.flaticon.com/free-icon/moon_616471
	const moon_full            = "https://cdn-icons-png.flaticon.com/512/616/616456.png"; // https://www.flaticon.com/free-icon/full-moon_616456
	const moon_waning_gibbous  = "https://cdn-icons-png.flaticon.com/512/616/616459.png"; // https://www.flaticon.com/free-icon/moon_616459
	const moon_last_quarter    = "https://cdn-icons-png.flaticon.com/512/616/616461.png"; // https://www.flaticon.com/free-icon/moon_616461
	const moon_waning_crescent = "https://cdn-icons-png.flaticon.com/512/616/616463.png"; // https://www.flaticon.com/free-icon/moon_616463

	// URL
	const KEY = "TZYHDL4PS29CM3UCGHUKYNX4N";
	const url = `https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline/${latitude},${longitude}?key=${KEY}&include=days&elements=datetime,moonphase,sunrise,sunset`
	
	// Parse the JSON data to obtain the data for displaying the results in the widget
	fetch(url)
	.then(response => response.json())
	.then(data => {
		document.querySelector('#sunrise').innerHTML = data.days[0].sunrise
		document.querySelector('#sunset').innerHTML = data.days[0].sunset
		document.querySelector('#percent').innerHTML = data.days[0].moonphase*100
		if (data.days[0].moonphase<0.025 || data.days[0].moonphase>=0.975) {
			document.querySelector('#image').src = moon_new;
			document.querySelector('#phase').innerHTML = "New Moon";
		}
		else if (data.days[0].moonphase>=0.025 && data.days[0].moonphase<0.225) {
			document.querySelector('#image').src = moon_waxing_crescent;
			document.querySelector('#phase').innerHTML = "Waxing Crescent";
		}
		else if (data.days[0].moonphase>=0.225 && data.days[0].moonphase<0.275) {
			document.querySelector('#image').src = moon_first_quarter;
			document.querySelector('#phase').innerHTML = "First Quarter";
		}
		else if (data.days[0].moonphase>=0.275 && data.days[0].moonphase<0.475) {
			document.querySelector('#image').src = moon_waxing_gibbous;
			document.querySelector('#phase').innerHTML = "Waxing Gibbous";
		}
		else if (data.days[0].moonphase>=0.475 && data.days[0].moonphase<0.525) {
			document.querySelector('#image').src = moon_full;
			document.querySelector('#phase').innerHTML = "Full Moon";
		}
		else if (data.days[0].moonphase>=0.525 && data.days[0].moonphase<0.725) {
			document.querySelector('#image').src = moon_waning_gibbous;
			document.querySelector('#phase').innerHTML = "Waxing Gibbous";
		}
		else if (data.days[0].moonphase>=0.725 && data.days[0].moonphase<0.775) {
			document.querySelector('#image').src = moon_last_quarter;
			document.querySelector('#phase').innerHTML = "Last Quarter";
		}
		else if (data.days[0].moonphase>=0.775 && data.days[0].moonphase<0.975) {
			document.querySelector('#image').src = moon_waning_crescent;
			document.querySelector('#phase').innerHTML = "Waxing Crescent";
		}
		
	})
	.catch(error => console.error('Error with moon:', error));
	
</script>
